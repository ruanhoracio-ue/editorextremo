# EditorExtremo — Ambiente completo para rodar na máquina do aluno.
# Sobe o backend (processamento de vídeo) e o frontend (a tela do app).
# O aluno não precisa mexer aqui: os atalhos EditorExtremo já cuidam de tudo.
#
# As imagens vêm prontas do Docker Hub: a máquina do aluno só baixa, não monta
# nada. Para publicar uma versão nova, rode ./publicar-imagens.command.

services:
  backend:
    image: SEU_USUARIO_DOCKERHUB/editorextremo-backend:latest
    container_name: editorextremo-backend
    ports:
      - "8000:8000"
    volumes:
      # Guarda os vídeos e jobs mesmo se o app for reiniciado
      - editorextremo_storage:/app/storage
      # Guarda o modelo de IA baixado (evita baixar de novo a cada vez)
      - editorextremo_models:/root/.cache/huggingface
    restart: unless-stopped

  frontend:
    image: SEU_USUARIO_DOCKERHUB/editorextremo-frontend:latest
    container_name: editorextremo-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  editorextremo_storage:
  editorextremo_models:
