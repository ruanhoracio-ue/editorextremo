# Editu — Ambiente completo para rodar na máquina do aluno.
# Sobe o backend (processamento de vídeo) e o frontend (a tela do app).
# O aluno não precisa mexer aqui: os atalhos Editu já cuidam de tudo.

services:
  backend:
    build: ./backend
    container_name: editu-backend
    ports:
      - "8000:8000"
    volumes:
      # Guarda os vídeos e jobs mesmo se o app for reiniciado
      - editu_storage:/app/storage
      # Guarda o modelo de IA baixado (evita baixar de novo a cada vez)
      - editu_models:/root/.cache/huggingface
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: editu-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  editu_storage:
  editu_models:
